# Saturn-compatible runtime configuration
# `wsUrl` and `nick` are the source-compatible keys. Legacy `url` and `name`
# remain accepted by the loader for existing Zenbot deployments.
dbPath = "database/database"
wsUrl = "wss://hack.chat/chat-ws"
cmdPrefix = "*"
channel = "programming"
nick = "alphaBot"
password = ""
adminTrips = []
autoReconnect = true
healthCheckInterval = 5
autorunCommands = []

# Agent configuration example
[agent]
enabled = false
endpoint = "http://localhost:16261"
model = "your-model"
# OpenAI-compatible transient failure retry policy.
maxRetries = 2
retryBackoffMillis = 250
# Number of completed exchanges included in prompts (1..60).
memoryTurns = 6
# Durable memory retention in minutes (1..525600).
memoryTtlMinutes = 1440
# Maximum Unicode code points sent as one visible agent response (1..1000000).
maxOutputChars = 8000
# Autonomous join moderation is off by default and independent of agent.enabled.
# It composes only when every positive threshold/window below is present.
moderationEnabled = false
moderationJoinBurstCount = 8
moderationJoinWindowSeconds = 10
moderationSameHashCount = 5
moderationSameHashWindowSeconds = 20
moderationNameClusterCount = 5
moderationNameClusterWindowSeconds = 20
moderationPostKickWindowSeconds = 600
moderationActionCooldownSeconds = 30
# Deterministic public-message anti-spam thresholds; no semantic/provider moderation.
moderationMessageBurstCount = 6
moderationMessageBurstWindowSeconds = 5
moderationRepeatedMessageCount = 4
moderationRepeatedMessageWindowSeconds = 10
moderationSecondBreachWindowSeconds = 30

# Source-compatible dynamic-SQL limits. The runtime keeps this disabled until
# the read-only H2 schema/query execution bridge is composed.
[agent.sql]
enabled = false
maxSqlChars = 4000
maxRows = 50
maxColumns = 32
maxCellChars = 2000
maxResultChars = 32000
timeoutMillis = 1000

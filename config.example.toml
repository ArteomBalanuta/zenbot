# Saturn-compatible Zenbot runtime configuration.
# Copy this file to the ignored config.toml and replace credential placeholders.
dbPath = "database/database"
wsUrl = "wss://hack.chat/chat-ws"
cmdPrefix = "*"
channel = "programming"
nick = "alphaBot"
trip = "YOUR_BOT_TRIP_HERE"
userTrips = ""
adminTrips = "YOUR_ADMIN_TRIP_HERE"
proxies = ""
autoReconnect = true
healthCheckInterval = 5
autorunCommands = ""

# Opt-in diagnostics for regular commands. The direct *l agent path is excluded.
[profiling]
enabled = false
listenAddress = "0.0.0.0:6060"
slowCommandThresholdMillis = 250
slowStageThresholdMillis = 25
slowTransportThresholdMillis = 25
# Runtime block sampling period in nanoseconds and mutex sampling fraction.
blockProfileRate = 1000000
mutexProfileFraction = 5

[agent]
enabled = false
# Environment variables take precedence. The client appends /v1/chat/completions.
endpoint = "http://localhost:16261"
model = ""
apiKeyEnv = "SATURN_AGENT_API_KEY"
timeoutSeconds = 30
requestTimeoutMillis = 180000
# Keep this close to the largest useful chat reply; excessive values only make
# a runaway or malformed completion slower to terminate.
maxCompletionTokens = 1024
thinkingEnabled = false
maxConcurrentRequests = 2
queueCapacity = 0

# Request-local worker/tool-loop bounds. Semantic completion assessments are
# separately constrained calls attached to these bounded worker cycles.
maxSteps = 5
maxToolCallsPerTurn = 4
toolTimeoutMillis = 10000
# Legacy aggregate limit retained for Saturn configuration compatibility.
maxToolCalls = 4
maxCallsPerTool = 2
maxToolFailures = 2
maxPromptChars = 8000
maxContextTokens = 16000
contextReserveTokens = 2048
maxOutputChars = 8000

# Shared public room memory and bounded recent room context.
memoryTurns = 30
# Keep this many newest raw turns after compacting older durable history.
memoryRawTurns = 20
# Unicode-character ceiling for the persisted untrusted summary.
memorySummaryMaxChars = 12000
memoryTtlHours = 168
creatorTrip = "YOUR_CREATOR_TRIP_HERE"
ambientEnabled = false
ambientEveryMessages = 8
quietMinutes = 15
contextMessageLimit = 60
noReplyMarker = "[[SATURN_NO_REPLY]]"
maxRetries = 2
retryBackoffMillis = 250

# Deterministic and semantic moderation are independent of ambient conversation.
moderationEnabled = true
moderationMessageBurstCount = 6
moderationMessageBurstWindowSeconds = 5
moderationRepeatedMessageCount = 4
moderationRepeatedMessageWindowSeconds = 10
moderationSecondBreachWindowSeconds = 30
moderationPostKickWindowSeconds = 600
moderationJoinBurstCount = 8
moderationJoinBurstWindowSeconds = 10
moderationSameHashJoinCount = 5
moderationSameHashJoinWindowSeconds = 20
moderationSuspiciousNameJoinCount = 5
moderationSuspiciousNameJoinWindowSeconds = 20
moderationActionCooldownSeconds = 30

# Creator/admin-only schema inspection and bounded read-only SQL.
dynamicSqlEnabled = true
dynamicSqlMaxSqlChars = 4000
dynamicSqlMaxRows = 50
dynamicSqlMaxColumns = 32
dynamicSqlMaxCellChars = 2000
dynamicSqlMaxResultChars = 32000
dynamicSqlTimeoutMillis = 1000

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: make check
      - run: make compile
      - run: go test -race ./...
      - name: Install agent capability test dependencies
        run: |
          python3 -m venv target/agent-tests-venv
          target/agent-tests-venv/bin/python -m pip install -r tests/agent_capabilities/requirements.txt
      - name: Test agent capability harness offline
        run: target/agent-tests-venv/bin/python -m pytest tests/agent_capabilities -m 'not provider and not live' --junitxml target/agent-capabilities.xml
      - name: Build runtime image without starting a bot
        run: docker build -t zenbot:ci .
